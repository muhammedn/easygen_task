services:
  mongo:
    image: mongo:7
    container_name: easygen-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
    container_name: easygen-api
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/easygen
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-32chars!!}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: 'false'
      TRUST_PROXY: 'true'
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: easygen-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  mongo_data:
