services:
  mongo:
    image: mongo:7
    container_name: easygen-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-easygen}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-local-dev-only-mongo-password}
    ports:
      # Host-only for local `npm run start:dev` (27018 avoids clash with a local mongod on 27017).
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
    container_name: easygen-api
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER:-easygen}:${MONGO_PASSWORD:-local-dev-only-mongo-password}@mongo:27017/easygen?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: 'false'
      TRUST_PROXY: 'true'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: easygen-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  mongo_data:
